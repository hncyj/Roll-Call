name: Build on Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UPX
        run: choco install upx --no-progress -y

      - name: Install dependencies
        run: pip install -r requirements-build.txt -r requirements-dev.txt

      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build EXE
        run: pyinstaller rollcall.spec

      - name: Smoke test EXE
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\随机点名.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Error "EXE crashed on startup (exit code $($proc.ExitCode))"
            exit 1
          }
          $proc.Kill()
          Write-Host "Smoke test passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 随机点名-windows
          path: dist/随机点名.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/随机点名.exe
